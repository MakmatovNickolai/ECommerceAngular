<div class="grid-wrapper">
    <div class="product-grid" [class.grid]="isGrid">
        @for (product of products; track product.id) {
            <div class="product-card">
                <div class="image-wrapper">
                    <img [src]="getImageUrl(product.imageIds?.[0])" />
                    <span class="discount-percent">-40%</span>
                    <span class="product-button favorite"><i class="fa fa-heart-o"></i></span>
                    <span class="product-button eye"><i class="fa fa-eye"></i></span>
                    <span class="add-cart">Add to Cart</span>
                </div>
                <div class="name">{{product.name}}</div>
                <div class="prices">
                    <div class="current-price">{{product.price}}$</div>
                    <div class="discount-price">160$</div>
                </div>        
                <div class="rating-info">
                    <div class="rating-stars">
                        <span class="fa fa-star checked"></span>
                        <span class="fa fa-star checked"></span>
                        <span class="fa fa-star checked"></span>
                        <span class="fa fa-star"></span>
                        <span class="fa fa-star"></span>
                    </div>
                    <span class="rating">({{product.rating}})</span>
                </div>
            </div>
        }
    </div>
</div>
