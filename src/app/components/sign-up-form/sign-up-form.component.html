<div class="form">
    <div class="header">Create an account</div>
    <div>Enter your details below</div>
    <input name="name" type="text" placeholder="Name" />
    <input name="email_phone" type="text" placeholder="Email or Phone Number" />
    <input name="password" type="password" placeholder="Password" />
    <button class="create-account">Create Account</button>
    <button class="sign-up-google">
        <i class="google-icon fa fa-google"></i>
        <span>Sign up with Google</span>
    </button>
    <p>Already have an account? <a routerLink="/log-in-page" routerLinkActive="active"
                ariaCurrentWhenActive="page">Log in</a></p>
</div>
